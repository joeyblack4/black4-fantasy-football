name: Verify league foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: football
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U football"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://football:local-test-only@localhost:5432/football
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
