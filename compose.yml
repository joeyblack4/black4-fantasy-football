name: black4-football-rehearsal
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: football
      POSTGRES_USER: football
      POSTGRES_PASSWORD: synthetic-local-only
    volumes:
      - football-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://football:synthetic-local-only@db/football
      HOST: 0.0.0.0
      PORT: 4312
    ports:
      - "127.0.0.1:4314:4312"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - football-local:/app/.local
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4312/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
  worker:
    build: .
    command: ["npm", "run", "worker", "--", "--synthetic"]
    environment:
      DATABASE_URL: postgresql://football:synthetic-local-only@db/football
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  football-db:
  football-local:
