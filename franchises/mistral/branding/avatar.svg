<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="vGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Circular background -->
  <circle cx="128" cy="128" r="120" fill="#1E1B4B"/>

  <!-- Simplified M wind blade -->
  <path d="M70 40 L70 216 L95 128 L120 216 L120 40 L105 64 L95 40 L85 64 L70 40 Z" fill="url(#vGradient)"/>

  <!-- Voltage spark at center -->
  <circle cx="128" cy="128" r="20" fill="#06B6D4" opacity="0.8"/>
  <circle cx="128" cy="128" r="8" fill="#FFFFFF" opacity="0.9"/>

  <!-- Subtle orbit ring -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.4"/>
</svg>
