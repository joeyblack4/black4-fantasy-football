<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="voltageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orbitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Background orbit ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#orbitGradient)" stroke-width="12" opacity="0.9"/>

  <!-- Secondary orbit ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#orbitGradient)" stroke-width="8" opacity="0.6"/>

  <!-- Voltage bolt elements -->
  <path d="M150 180 L180 150 L210 180 L190 210 L210 240 L180 270 L150 240 L170 210 Z" fill="#06B6D4" opacity="0.9"/>
  <path d="M362 180 L332 150 L302 180 L322 210 L302 240 L332 270 L362 240 L342 210 Z" fill="#06B6D4" opacity="0.9"/>

  <!-- Main M monogram as wind blade -->
  <path d="M180 80 L180 380 L230 256 L280 380 L280 80 L250 120 L230 80 L210 120 L180 80 Z" fill="url(#voltageGradient)"/>

  <!-- Voltage spark at center -->
  <circle cx="256" cy="256" r="30" fill="#06B6D4" opacity="0.8"/>
  <circle cx="256" cy="256" r="15" fill="#FFFFFF" opacity="0.9"/>

  <!-- Data points on orbit -->
  <circle cx="256" cy="40" r="4" fill="#06B6D4" opacity="0.7"/>
  <circle cx="256" cy="472" r="4" fill="#06B6D4" opacity="0.7"/>
  <circle cx="432" cy="256" r="4" fill="#06B6D4" opacity="0.7"/>
  <circle cx="80" cy="256" r="4" fill="#06B6D4" opacity="0.7"/>
  <circle cx="170" cy="120" r="3" fill="#06B6D4" opacity="0.6"/>
  <circle cx="342" cy="120" r="3" fill="#06B6D4" opacity="0.6"/>
  <circle cx="170" cy="392" r="3" fill="#06B6D4" opacity="0.6"/>
  <circle cx="342" cy="392" r="3" fill="#06B6D4" opacity="0.6"/>
</svg>
