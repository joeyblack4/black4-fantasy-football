<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1E2640" />
      <stop offset="100%" stop-color="#0A0D14" />
    </radialGradient>

    <!-- Neon Google Colors -->
    <linearGradient id="google-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1A73E8" />
    </linearGradient>
    <linearGradient id="google-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#C5221F" />
    </linearGradient>
    <linearGradient id="google-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#F29900" />
    </linearGradient>
    <linearGradient id="google-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#137333" />
    </linearGradient>

    <!-- Cyber Football Gradient -->
    <linearGradient id="cyber-ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#0000FF" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intense-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComponentTransfer in="blur" result="boost">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boost" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Border & Dark Base Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg-glow)" stroke="#1F325C" stroke-width="6" />

  <!-- Grid Pattern (Data Matrix / Football Yard Lines) -->
  <g opacity="0.15">
    <!-- Vertical Grid Lines (Columns) -->
    <line x1="64" y1="0" x2="64" y2="512" stroke="#4285F4" stroke-width="1.5" />
    <line x1="128" y1="0" x2="128" y2="512" stroke="#4285F4" stroke-width="1.5" />
    <line x1="192" y1="0" x2="192" y2="512" stroke="#4285F4" stroke-width="1.5" />
    <line x1="256" y1="0" x2="256" y2="512" stroke="#4285F4" stroke-width="1.5" />
    <line x1="320" y1="0" x2="320" y2="512" stroke="#4285F4" stroke-width="1.5" />
    <line x1="384" y1="0" x2="384" y2="512" stroke="#4285F4" stroke-width="1.5" />
    <line x1="448" y1="0" x2="448" y2="512" stroke="#4285F4" stroke-width="1.5" />

    <!-- Horizontal Grid Lines (Yard Lines) -->
    <line x1="0" y1="64" x2="512" y2="64" stroke="#34A853" stroke-width="1.5" />
    <line x1="0" y1="128" x2="512" y2="128" stroke="#34A853" stroke-width="1.5" />
    <line x1="0" y1="192" x2="512" y2="192" stroke="#34A853" stroke-width="1.5" />
    <line x1="0" y1="256" x2="512" y2="256" stroke="#34A853" stroke-width="1.5" />
    <line x1="0" y1="320" x2="512" y2="320" stroke="#34A853" stroke-width="1.5" />
    <line x1="0" y1="384" x2="512" y2="384" stroke="#34A853" stroke-width="1.5" />
    <line x1="0" y1="448" x2="512" y2="448" stroke="#34A853" stroke-width="1.5" />
  </g>

  <!-- Yard Line Numbers on Sides (Subtle Football Detail) -->
  <g font-family="monospace" font-size="12" fill="#34A853" opacity="0.3" text-anchor="middle">
    <text x="32" y="132">10</text>
    <text x="32" y="196">20</text>
    <text x="32" y="260">30</text>
    <text x="32" y="324">40</text>
    <text x="32" y="388">50</text>

    <text x="480" y="132">10</text>
    <text x="480" y="196">20</text>
    <text x="480" y="260">30</text>
    <text x="480" y="324">40</text>
    <text x="480" y="388">50</text>
  </g>

  <!-- Neural Network "M" Path -->
  <!-- We draw a futuristic connected node path forming an M -->
  <g opacity="0.9">
    <!-- Connection lines -->
    <!-- Left vertical track -->
    <line x1="128" y1="384" x2="128" y2="160" stroke="url(#google-blue)" stroke-width="8" stroke-linecap="round" />
    <!-- Diagonal down-right -->
    <line x1="128" y1="160" x2="256" y2="288" stroke="url(#google-red)" stroke-width="8" stroke-linecap="round" />
    <!-- Diagonal up-right -->
    <line x1="256" y1="288" x2="384" y2="160" stroke="url(#google-yellow)" stroke-width="8" stroke-linecap="round" />
    <!-- Right vertical track -->
    <line x1="384" y1="160" x2="384" y2="384" stroke="url(#google-green)" stroke-width="8" stroke-linecap="round" />

    <!-- Outer accent lines for technological complexity -->
    <path d="M 96,384 L 128,384 L 128,128 L 160,128" fill="none" stroke="#4285F4" stroke-width="2" opacity="0.5" stroke-dasharray="6,4" />
    <path d="M 416,384 L 384,384 L 384,128 L 352,128" fill="none" stroke="#34A853" stroke-width="2" opacity="0.5" stroke-dasharray="6,4" />
  </g>

  <!-- Glowing Cyber Football in the Center of the "M" -->
  <!-- Tilted 45 degrees, positioned in the middle, nested perfectly -->
  <g transform="translate(256, 288) rotate(-45)">
    <!-- Glow Backing -->
    <ellipse cx="0" cy="0" rx="90" ry="55" fill="url(#cyber-ball)" opacity="0.25" filter="url(#intense-glow)" />

    <!-- Football Body -->
    <path d="M -80 0 C -35 -55, 35 -55, 80 0 C 35 55, -35 55, -80 0 Z" fill="url(#cyber-ball)" stroke="#00F2FE" stroke-width="4" />

    <!-- Grid/Matrix pattern on football skin -->
    <path d="M -50 -15 L 50 -15" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />
    <path d="M -50 15 L 50 15" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />

    <!-- White Football Stripes -->
    <path d="M -50 -25 C -45 -10, -45 10, -50 25" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M 50 -25 C 45 -10, 45 10, 50 25" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" />

    <!-- Laces / Stitches (Digital circuit-board style) -->
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <!-- Cross Laces -->
    <line x1="-20" y1="-8" x2="-20" y2="8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="-7" y1="-8" x2="-7" y2="8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="6" y1="-8" x2="6" y2="8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="19" y1="-8" x2="19" y2="8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

    <!-- Pulse Dots on Laces -->
    <circle cx="-20" cy="0" r="3" fill="#FFFFFF" />
    <circle cx="19" cy="0" r="3" fill="#FFFFFF" />
  </g>

  <!-- Neural Network Nodes (Circles at key joints of the M) -->
  <!-- Top-Left Node (Google Blue) -->
  <circle cx="128" cy="160" r="14" fill="url(#google-blue)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#glow)" />
  <circle cx="128" cy="160" r="5" fill="#FFFFFF" />

  <!-- Bottom-Left Node (Google Red) -->
  <circle cx="128" cy="384" r="14" fill="url(#google-red)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#glow)" />
  <circle cx="128" cy="384" r="5" fill="#FFFFFF" />

  <!-- Center Dip Node / Intersector (Glowing Cyan/Blue, overlapping the football center) -->
  <!-- Since the center of the M is at 256, 288, we place a node representing the "activation function" -->
  <circle cx="256" cy="288" r="16" fill="#00F2FE" stroke="#FFFFFF" stroke-width="3" filter="url(#glow)" />
  <circle cx="256" cy="288" r="6" fill="#000D1A" />

  <!-- Top-Right Node (Google Yellow) -->
  <circle cx="384" cy="160" r="14" fill="url(#google-yellow)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#glow)" />
  <circle cx="384" cy="160" r="5" fill="#FFFFFF" />

  <!-- Bottom-Right Node (Google Green) -->
  <circle cx="384" cy="384" r="14" fill="url(#google-green)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#glow)" />
  <circle cx="384" cy="384" r="5" fill="#FFFFFF" />

  <!-- Top Decorative Circuit Details -->
  <g opacity="0.6">
    <circle cx="256" cy="110" r="4" fill="#4285F4" />
    <line x1="256" y1="110" x2="256" y2="135" stroke="#4285F4" stroke-width="2" />
    <line x1="256" y1="135" x2="220" y2="135" stroke="#4285F4" stroke-width="2" />
    <line x1="256" y1="135" x2="292" y2="135" stroke="#4285F4" stroke-width="2" />
  </g>

  <!-- Typography: MOUNTAIN VIEW MATRIX -->
  <!-- Curved/futuristic branding text -->
  <text x="256" y="455" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="900" fill="#F8F9FA" text-anchor="middle" letter-spacing="4">MOUNTAIN VIEW</text>
  <text x="256" y="482" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="900" fill="#00F2FE" text-anchor="middle" letter-spacing="8" filter="url(#glow)">MATRIX</text>

</svg>
