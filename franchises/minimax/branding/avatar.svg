<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="House of Mavis avatar">
  <title>House of Mavis avatar</title>
  <desc>Square avatar with indigo field, dashed coral ring, and a serif M monogram.</desc>

  <defs>
    <radialGradient id="avBg" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#252774"/>
      <stop offset="100%" stop-color="#0E0F2C"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" fill="url(#avBg)"/>

  <!-- Dashed coral ring -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="#FF5C5C" stroke-width="3"
          stroke-dasharray="8 6" opacity="0.9"/>

  <!-- Inner coral dot accents at cardinal points -->
  <circle cx="128" cy="28" r="3.5" fill="#FF5C5C"/>
  <circle cx="228" cy="128" r="3.5" fill="#FF5C5C"/>
  <circle cx="128" cy="228" r="3.5" fill="#FF5C5C"/>
  <circle cx="28" cy="128" r="3.5" fill="#FF5C5C"/>

  <!-- Center monogram M, scaled and re-anchored -->
  <g transform="translate(128 128) scale(0.7)">
    <path d="M -78 -68 L -78 68 L -52 68 L -52 -22 L 0 70 L 52 -22 L 52 68 L 78 68 L 78 -68 L 50 -68 L 0 30 L -50 -68 Z"
          fill="#F5F1E8"/>
    <rect x="-46" y="78" width="92" height="6" fill="#FF5C5C"/>
  </g>
</svg>
